name: CS.RIN.RU Release Notifier

on:
  schedule:
    # Runs every 15 minutes with offset to bypass GitHub top-of-hour queue throttling
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Latest State
        run: |
          git pull --rebase origin main || true

      - name: Run Forum Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CSRIN_COOKIE: ${{ secrets.CSRIN_COOKIE }}
        run: |
          python run_once.py

      - name: Commit & Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): update tracked forum state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
