name: Auto Deploy to Koyeb

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb Rebuild & Deploy
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN || 'v760whjgplp2f7t7y720wyvl7ni2yfeg4oa3hnuuwyn7yp224kbzz84bshyhua5q' }}
        run: |
          echo "🚀 Triggering automatic rebuild on Koyeb..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $KOYEB_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"use_cache": false}' \
            https://app.koyeb.com/v1/services/ae8bf9e5-c870-438c-a70f-2fa8051c5b92/redeploy)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Koyeb deployment successfully queued!"
          else
            echo "⚠️ Failed to trigger Koyeb deployment (HTTP $HTTP_STATUS):"
            echo "$BODY"
          fi
