name: Koyeb 24/7 Keep-Alive

on:
  schedule:
    # Runs every 25 minutes to keep Koyeb Free Tier awake 24/7
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Koyeb Health Endpoint
        env:
          KOYEB_APP_URL: ${{ secrets.KOYEB_APP_URL }}
        run: |
          TARGET_URL="${KOYEB_APP_URL:-https://increasing-saree-yuno74-2b5073cf.koyeb.app}"
          URL="${TARGET_URL%/}/health"
          echo "Pinging $URL to keep Koyeb instance active..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$URL" || true)
          echo "Received HTTP $HTTP_CODE from Koyeb (Keep-alive successful!)"
